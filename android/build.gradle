buildscript {
    // Defer to the host app's pinned versions where it has them. A library that
    // hardcodes its own AGP/Kotlin is a library that breaks somebody's build the
    // week they upgrade.
    ext.safeExtGet = { prop, fallback ->
        rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:8.7.2"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '2.2.0')}"
    }
}

// New architecture is the default from React Native 0.79 on, so an absent
// property means "on", not "off". Reading it as off would silently compile the
// legacy source set into a new-architecture app, where the module then fails to
// register as a TurboModule.
def isNewArchitectureEnabled() {
    if (!project.hasProperty("newArchEnabled")) {
        return true
    }
    return project.property("newArchEnabled").toString() == "true"
}

apply plugin: "com.android.library"
apply plugin: "org.jetbrains.kotlin.android"

// com.deeplinkly:deeplinkly-android is compiled with Kotlin 2.2.0, and a 2.0.x
// compiler cannot read 2.2.0 metadata. Gradle loads one Kotlin plugin for the
// entire build, so the version is decided by the *host app*, not by anything
// this file can set — and the React Native 0.79 template lands on 2.0.21.
//
// Read from the applied plugin rather than from ext.kotlinVersion, because the
// two disagree in exactly the case this check exists for: the template leaves
// its classpath entry unversioned, so KGP arrives transitively from
// react-native-gradle-plugin and setting ext alone changes nothing.
//
// Without this, the failure surfaces as "Internal compiler error" over a wall of
// FIR stack frames, which says nothing about what to change.
def MIN_KOTLIN = "2.2.0"
def hostKotlin = org.jetbrains.kotlin.gradle.plugin.KotlinPluginWrapperKt
    .getKotlinPluginVersion(project)
if (org.gradle.util.internal.VersionNumber.parse(hostKotlin)
        < org.gradle.util.internal.VersionNumber.parse(MIN_KOTLIN)) {
    throw new GradleException(
        "react-native-deeplinkly needs Kotlin ${MIN_KOTLIN} or newer; this build resolved ${hostKotlin}.\n\n" +
        "In android/build.gradle set the version AND pin it on the classpath —\n" +
        "setting ext alone does nothing while the classpath entry is unversioned:\n\n" +
        "    buildscript {\n" +
        "        ext { kotlinVersion = \"${MIN_KOTLIN}\" }\n" +
        "        dependencies {\n" +
        "            classpath(\"org.jetbrains.kotlin:kotlin-gradle-plugin:\$kotlinVersion\")\n" +
        "        }\n" +
        "    }\n"
    )
}

if (isNewArchitectureEnabled()) {
    // Drives codegen for the TurboModule spec in src/NativeDeeplinkly.ts. Without
    // it the generated NativeDeeplinklySpec that src/newarch compiles against does
    // not exist.
    apply plugin: "com.facebook.react"
}

group = "com.deeplinkly.reactnative"
version = new groovy.json.JsonSlurper().parse(file("../package.json")).version

repositories {
    google()
    mavenCentral()
    // Opt-in seam for developing this bridge against an unreleased native SDK:
    // run `./gradlew publishToMavenLocal` in android_deeplinkly, then build with
    // -Pdeeplinkly.useMavenLocal=true. Off by default, because a machine-local
    // artifact silently shadowing a real one is exactly the kind of
    // irreproducible build nobody wants to debug.
    if (project.findProperty("deeplinkly.useMavenLocal") == "true") {
        mavenLocal()
    }
}

android {
    namespace = "com.deeplinkly.reactnative"
    compileSdk = safeExtGet("compileSdkVersion", 35)

    defaultConfig {
        minSdk = safeExtGet("minSdkVersion", 24)
        buildConfigField "boolean", "IS_NEW_ARCHITECTURE_ENABLED", isNewArchitectureEnabled().toString()
    }

    buildFeatures {
        buildConfig = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            // The two specs declare an identical method surface; only their
            // superclass differs. Keeping the concrete module in `main` means the
            // real logic is written once and neither architecture can drift.
            if (isNewArchitectureEnabled()) {
                java.srcDirs += ["src/newarch/java"]
            } else {
                java.srcDirs += ["src/oldarch/java"]
            }
        }
    }

    lint {
        abortOnError = false
    }

    testOptions {
        unitTests {
            // The bridge's unit tests never touch a real React instance, but
            // android.jar's stubs throw by default and the React classes read
            // enough of them on construction to matter.
            returnDefaultValues = true
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

dependencies {
    implementation "com.facebook.react:react-android"

    // The SDK itself. Everything below the bridge — deep link resolution, the
    // install referrer, attribution, the queues, retries, device signals,
    // networking — lives here and is shared with every other Deeplinkly
    // integration, so none of them can drift.
    //
    // `api`, not `implementation`: a host app that wants to call Deeplinkly
    // directly (to log an event from native code alongside JS, say) can, without
    // re-declaring the dependency.
    //
    // Its transitive dependencies are deliberately NOT repeated here —
    // installreferrer, play-services-appset, coroutines and core-ktx, plus the
    // compileOnly treatment of play-services-ads-identifier that keeps the AD_ID
    // permission out of host manifests.
    api "com.deeplinkly:deeplinkly-android:1.3.0"

    // mockk, because the surface under test is a Kotlin `object` (Deeplinkly) and
    // React's context classes are final — neither of which Mockito can stand in
    // for without extra plumbing.
    testImplementation "junit:junit:4.13.2"
    testImplementation "io.mockk:mockk:1.13.13"
}
